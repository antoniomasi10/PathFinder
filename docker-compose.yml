version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: coha-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: coha
      POSTGRES_USER: coha
      POSTGRES_PASSWORD: coha
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: coha-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
