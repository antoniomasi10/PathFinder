version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: coha-db
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coha}
      POSTGRES_USER: ${POSTGRES_USER:-coha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coha}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: coha-redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: coha-libretranslate
    restart: unless-stopped
    environment:
      - LT_LOAD_ONLY=en,it,es,fr,zh
      - LT_DISABLE_WEB_UI=true
      - LT_API_KEYS=false
    volumes:
      - lt_models:/home/libretranslate/.local
    expose:
      - "5000"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coha-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-coha}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-coha}?schema=public
      REDIS_URL: redis://redis:6379
      LIBRETRANSLATE_URL: http://libretranslate:5000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      libretranslate:
        condition: service_started

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  redisdata:
  lt_models:
